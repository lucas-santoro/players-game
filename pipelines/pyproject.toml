[project]
name = "pipelines"
version = "0.0.0"
description = "Offline ETL/scrape pipelines for the Players Game database."
requires-python = ">=3.13"
dependencies = [
    "polars>=1.18",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pydantic>=2.10",
    "rich>=13.9",
    "python-slugify>=8.0",
    "pycountry>=24.6",
    "pycountry-convert>=0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]
